name: Native OBS plugin
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: obs32.2.2-qt6.8.3-opencv4.10-ort1.20.1-v1
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-plugin.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OWCS-OB-Analyzer-OBS-windows-x64
          path: release/OWCS-OB-Analyzer-OBS-*
