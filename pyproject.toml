[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owcs-ob-analyzer"
version = "0.1.0"
description = "Real-time Overwatch custom spectator HUD analyzer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PySide6>=6.7,<7",
  "mss>=9,<11",
  "dxcam>=0.0.5; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
owcs-ob-analyzer = "owcs_ob_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owcs_ob_analyzer = [
  "resources/heroes/illustrated/*.png",
  "resources/models/*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
